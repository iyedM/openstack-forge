# OpenStack Forge - Example cluster definition
# This file is documentation-only and intentionally uses fictional values.
# Check it with: openstack-forge config validate examples/cluster.example.yaml
# The full set of rules is documented in docs/configuration/README.md.

cluster:
  name: "forge-demo"
  ubuntu_version: "24.04"       # the only supported Ubuntu release
  openstack_release: "2025.1"   # Epoxy, installed from the cloud-archive:epoxy repository
  topology: "private-cloud"
  # Optional upstream NTP servers for the controller (time-sync-controller step). When
  # absent, the controller keeps the distribution's default pool of public servers.
  # ntp_servers:
  #   - "ntp1.example.internal"

networks:
  management:
    subnet: "10.10.40.0/24"
    gateway: "10.10.40.1"
    dns:
      - "10.10.40.10"
    interface: "ens3"
  storage:
    subnet: "10.10.50.0/24"
    gateway: "10.10.50.1"
    interface: "ens4"
  # External network that instances reach through floating IPs.
  provider:
    subnet: "10.10.60.0/24"
    gateway: "10.10.60.1"
    interface: "ens5"
    floating_ip_range:
      start: "10.10.60.100"
      end: "10.10.60.199"
    # Optional: addresses handed out by a DHCP server on this network; must not
    # overlap the floating IP range.
    dhcp_range:
      start: "10.10.60.200"
      end: "10.10.60.250"

# Roles: exactly one controller, at least one compute, at most one block and one object node.
# vcpus and ram_gb declare the expected hardware so later checks can compare it with reality.
nodes:
  - role: controller
    hostname: "forge-controller-01"
    fqdn: "forge-controller-01.example.internal"
    management_ip: "10.10.40.11"
    vcpus: 8
    ram_gb: 32
    interfaces:
      management: "ens3"
      storage: "ens4"
      provider: "ens5"
    tags: ["control-plane", "identity", "network"]

  - role: compute
    hostname: "forge-compute-01"
    fqdn: "forge-compute-01.example.internal"
    management_ip: "10.10.40.21"
    vcpus: 16
    ram_gb: 64
    interfaces:
      management: "ens3"
      storage: "ens4"
      provider: "ens5"
    tags: ["compute"]

  - role: compute
    hostname: "forge-compute-02"
    fqdn: "forge-compute-02.example.internal"
    management_ip: "10.10.40.22"
    vcpus: 16
    ram_gb: 64
    interfaces:
      management: "ens3"
      storage: "ens4"
      provider: "ens5"
    tags: ["compute"]

  # Block storage (Cinder) node: exactly one data disk.
  - role: block
    hostname: "forge-block-01"
    fqdn: "forge-block-01.example.internal"
    management_ip: "10.10.40.31"
    vcpus: 4
    ram_gb: 16
    disk: "/dev/sdb"
    interfaces:
      management: "ens3"
      storage: "ens4"
    tags: ["cinder"]

  # Object storage (Swift) node: one or more data disks.
  - role: object
    hostname: "forge-object-01"
    fqdn: "forge-object-01.example.internal"
    management_ip: "10.10.40.32"
    vcpus: 4
    ram_gb: 16
    disks:
      - "/dev/sdb"
      - "/dev/sdc"
    interfaces:
      management: "ens3"
      storage: "ens4"
    tags: ["swift"]
