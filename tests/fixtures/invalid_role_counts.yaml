# Two controllers, no compute node and two block nodes.
cluster:
  name: "bad-counts"
  ubuntu_version: "24.04"
  openstack_release: "2025.1"
  topology: "private-cloud"

networks:
  management:
    subnet: "192.0.2.0/24"
    gateway: "192.0.2.1"
    interface: "eth0"
  provider:
    subnet: "203.0.113.0/24"
    gateway: "203.0.113.1"
    interface: "eth1"
    floating_ip_range:
      start: "203.0.113.100"
      end: "203.0.113.199"

nodes:
  - role: controller
    hostname: "ctl-01"
    fqdn: "ctl-01.cluster.test"
    management_ip: "192.0.2.11"
    vcpus: 4
    ram_gb: 16
    interfaces:
      management: "eth0"

  - role: controller
    hostname: "ctl-02"
    fqdn: "ctl-02.cluster.test"
    management_ip: "192.0.2.12"
    vcpus: 4
    ram_gb: 16
    interfaces:
      management: "eth0"

  - role: block
    hostname: "blk-01"
    fqdn: "blk-01.cluster.test"
    management_ip: "192.0.2.31"
    vcpus: 4
    ram_gb: 16
    disk: "/dev/sdb"
    interfaces:
      management: "eth0"

  - role: block
    hostname: "blk-02"
    fqdn: "blk-02.cluster.test"
    management_ip: "192.0.2.32"
    vcpus: 4
    ram_gb: 16
    disk: "/dev/sdb"
    interfaces:
      management: "eth0"
