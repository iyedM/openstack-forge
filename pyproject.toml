[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openstack-forge"
version = "0.1.0"
description = "Deterministic, idempotent CLI and execution engine for multi-node OpenStack 2025.1 (Epoxy) private cloud deployments on Ubuntu 24.04."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenStack Forge contributors" }]
keywords = ["openstack", "epoxy", "ubuntu", "infrastructure", "automation", "devops", "cloud", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]

dependencies = [
  "jsonschema>=4.10.3",
  "PyYAML>=6.0",
]

[project.scripts]
openstack-forge = "openstack_forge.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
  # Same as build-system.requires; lets the packaging test build a wheel offline.
  "setuptools>=68",
  "wheel",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openstack_forge.config" = ["schemas/*.json"]
"openstack_forge.orchestration" = ["data/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["openstack_forge"]
